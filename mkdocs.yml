site_name: "IHC · Grupo 04"
site_url: "https://unb-ihc.github.io/IHC_2026.2_Grupo04/"
site_description: "Guia de Acessibilidade & Avaliação de IHC - Universidade de Brasília (UnB / FGA)"
site_author: "Grupo 04 - IHC"
repo_url: "https://github.com/UnB-IHC/IHC_2026.2_Grupo04"
repo_name: "UnB-IHC/IHC_2026.2_Grupo04"

theme:
  name: material
  custom_dir: overrides
  logo: assets/grupo-04.svg
  favicon: assets/grupo-04.svg
  font: false
  language: pt-BR
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.footer
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html

hooks:
  - hooks/apresentacao.py

extra_css:
  - stylesheets/portal.css

extra_javascript:
  - javascripts/portal.js

extra:
  generator: false

